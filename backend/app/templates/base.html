<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="shortcut icon" href="/static/media/logos/favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
    <link href="/static/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="/static/css/style.bundle.css" rel="stylesheet" type="text/css" />
    {% block extra_head %}{% endblock %}
</head>
<body id="kt_body" class="header-fixed header-tablet-and-mobile-fixed toolbar-enabled aside-fixed aside-default-enabled">
<script>
var defaultThemeMode = "light";
var themeMode;
if (document.documentElement) {
    if (document.documentElement.hasAttribute("data-bs-theme-mode")) {
        themeMode = document.documentElement.getAttribute("data-bs-theme-mode");
    } else if (localStorage.getItem("data-bs-theme") !== null) {
        themeMode = localStorage.getItem("data-bs-theme");
    } else {
        themeMode = defaultThemeMode;
    }
    if (themeMode === "system") {
        themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-bs-theme", themeMode);
}
</script>
<div class="d-flex flex-column flex-root">
    <div class="page d-flex flex-row flex-column-fluid">
        <div id="kt_aside" class="aside aside-default aside-hoverable" data-kt-drawer="true" data-kt-drawer-name="aside"
             data-kt-drawer-activate="{default: true, lg: false}" data-kt-drawer-overlay="true"
             data-kt-drawer-width="{default:'200px', '300px': '250px'}" data-kt-drawer-direction="start"
             data-kt-drawer-toggle="#kt_aside_toggle">
            <div class="aside-logo flex-column-auto px-10 pt-9 pb-5">
                {% include "partials/brand_logo.html" %}
            </div>
            <div class="aside-menu flex-column-fluid ps-3 pe-1">
                <div class="menu menu-column menu-rounded menu-title-gray-600 menu-icon-gray-400 menu-active-bg menu-state-primary fw-semibold fs-6 my-5 px-3">
                    <div class="menu-item">
                        <a class="menu-link {% if active_nav == 'dashboard' %}active{% endif %}" href="/dashboard">
                            <span class="menu-icon"><i class="ki-duotone ki-element-11 fs-2"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span></i></span>
                            <span class="menu-title">Dashboard</span>
                        </a>
                    </div>
                    <div class="menu-item">
                        <a class="menu-link {% if active_nav == 'agents' %}active{% endif %}" href="/agents">
                            <span class="menu-icon"><i class="ki-duotone ki-profile-user fs-2"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span></i></span>
                            <span class="menu-title">Agents</span>
                        </a>
                    </div>
                    <div class="menu-item">
                        <a class="menu-link {% if active_nav == 'workflows' or active_nav == 'workflows_templates' %}active{% endif %}" href="/workflows">
                            <span class="menu-icon"><i class="ki-duotone ki-abstract-26 fs-2"><span class="path1"></span><span class="path2"></span></i></span>
                            <span class="menu-title">Workflows</span>
                        </a>
                    </div>
                    <div class="menu-item">
                        <a class="menu-link {% if active_nav == 'runs' %}active{% endif %}" href="/runs">
                            <span class="menu-icon"><i class="ki-duotone ki-chart-line fs-2"><span class="path1"></span><span class="path2"></span></i></span>
                            <span class="menu-title">Runs</span>
                        </a>
                    </div>
                    <div class="menu-item">
                        <a class="menu-link {% if active_nav == 'channels' %}active{% endif %}" href="/channels">
                            <span class="menu-icon"><i class="ki-duotone ki-message-text-2 fs-2"><span class="path1"></span><span class="path2"></span><span class="path3"></span></i></span>
                            <span class="menu-title">Channels</span>
                        </a>
                    </div>
                    <div class="menu-item">
                        <a class="menu-link {% if active_nav == 'users' %}active{% endif %}" href="/users">
                            <span class="menu-icon"><i class="ki-duotone ki-people fs-2"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span><span class="path5"></span></i></span>
                            <span class="menu-title">Users</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="wrapper d-flex flex-column flex-row-fluid" id="kt_wrapper">
            <div id="kt_header" class="header">
                <div class="container-fluid d-flex align-items-stretch justify-content-between py-4">
                    <div class="d-flex align-items-center d-lg-none">
                        <button class="btn btn-icon btn-active-color-primary" id="kt_aside_toggle">
                            <i class="ki-duotone ki-abstract-14 fs-1"><span class="path1"></span><span class="path2"></span></i>
                        </button>
                    </div>
                    <h1 class="text-dark fw-bold mb-0 d-none d-lg-block">{% block header_title %}{{ app_name }}{% endblock %}</h1>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-gray-700 fw-semibold">{{ user.full_name or user.email }}</span>
                        <form method="post" action="/auth/logout">
                            <button type="submit" class="btn btn-sm btn-light-primary">Sign Out</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="content fs-6 d-flex flex-column flex-column-fluid" id="kt_content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</div>
<script src="/static/plugins/global/plugins.bundle.js"></script>
<script src="/static/js/scripts.bundle.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
