<div id="run-usage-panel"
     {% if run.status in ('pending', 'running') %}data-run-poll{% endif %}>
    <div class="card mt-6">
        <div class="card-header border-0 pt-6">
            <h3 class="fw-bold text-dark mb-0">Token usage</h3>
        </div>
        <div class="card-body pt-0">
            {% if run.usage %}
            <div class="table-responsive">
                <table class="table align-middle table-row-dashed fs-6 gy-3">
                    <thead>
                        <tr class="text-start text-gray-500 fw-bold fs-7 text-uppercase">
                            <th>Agent</th>
                            <th>Prompt</th>
                            <th>Completion</th>
                            <th>Cost (USD)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in run.usage %}
                        <tr>
                            <td>{{ row.agent_id or '—' }}</td>
                            <td>{{ row.prompt_tokens }}</td>
                            <td>{{ row.completion_tokens }}</td>
                            <td>${{ row.cost_usd }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <p class="text-gray-500 mb-0">No token usage recorded yet.</p>
            {% endif %}
        </div>
    </div>
</div>
