<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set New Password | {{ app_name }}</title>
    <link rel="shortcut icon" href="/static/media/logos/favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
    <link href="/static/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="/static/css/style.bundle.css" rel="stylesheet" type="text/css" />
</head>
<body id="kt_body" class="auth-bg">
<div class="d-flex flex-column flex-root">
    <div class="d-flex flex-column flex-lg-row flex-column-fluid">
        <div class="d-flex flex-column flex-lg-row-auto bg-primary w-xl-600px">
            <div class="d-flex flex-column position-xl-fixed top-0 bottom-0 w-xl-600px scroll-y justify-content-center text-center p-10">
                <a href="/" class="py-2 d-inline-block">
                    <img alt="{{ app_name }}" src="/static/media/logos/logo-orqestra-mark.svg" class="h-60px" />
                </a>
                <h1 class="fw-bold text-white fs-2qx mt-10">New password</h1>
            </div>
        </div>
        <div class="d-flex flex-column flex-lg-row-fluid py-10">
            <div class="d-flex flex-center flex-column flex-column-fluid">
                <div class="w-lg-500px p-10 p-lg-15 mx-auto">
                    <form class="form w-100" method="post" action="/auth/reset-password">
                        <input type="hidden" name="token" value="{{ token }}" />
                        <div class="text-center mb-10">
                            <h1 class="text-dark mb-3">Choose a new password</h1>
                            <div class="text-gray-400 fw-semibold fs-6">At least 8 characters</div>
                        </div>

                        {% if error == 'mismatch' %}
                        <div class="alert alert-danger p-5 mb-10">
                            <span class="fw-semibold">Passwords do not match.</span>
                        </div>
                        {% elif error == 'weak_password' %}
                        <div class="alert alert-danger p-5 mb-10">
                            <span class="fw-semibold">Password must be at least 8 characters.</span>
                        </div>
                        {% endif %}

                        <div class="fv-row mb-8">
                            <label class="form-label fw-bold text-dark">New password</label>
                            <input class="form-control form-control-lg form-control-solid"
                                   type="password" name="password" autocomplete="new-password" required minlength="8" />
                        </div>
                        <div class="fv-row mb-10">
                            <label class="form-label fw-bold text-dark">Confirm password</label>
                            <input class="form-control form-control-lg form-control-solid"
                                   type="password" name="password_confirm" autocomplete="new-password" required minlength="8" />
                        </div>
                        <div class="text-center mb-5">
                            <button type="submit" class="btn btn-lg btn-primary w-100">Update password</button>
                        </div>
                        <div class="text-center">
                            <a href="/auth/login" class="link-primary fw-semibold fs-6">Back to sign in</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/plugins/global/plugins.bundle.js"></script>
<script src="/static/js/scripts.bundle.js"></script>
</body>
</html>
